<title id="title">Uma entrada para ferramentas diferentes</title><desc id="desc">O supervisor acessa Riscos/K2 em Lambda e Fraude em um servidor MCP. O Gateway autentica, aplica Policy e usa a credencial adequada a cada target.</desc>
