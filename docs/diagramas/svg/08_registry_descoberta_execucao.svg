<tspan x="153" dy="0">O QUE ESTE NOTEBOOK ENSINA</tspan>
</text>
<text class="" x="153" y="918" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" text-anchor="start">
<tspan x="153" dy="0">Registry responde “o que existe”; Policy decide “o que este chamador pode fazer”.</tspan>
</text>
<text class="" x="64" y="978" fill="#52657C" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">
