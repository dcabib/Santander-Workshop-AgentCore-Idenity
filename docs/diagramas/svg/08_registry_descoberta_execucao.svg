<tspan x="86" dy="0">WORKSHOP SANTANDER  /  AGENTCORE  /  08</tspan>
</text>
<text class="" x="64" y="122" fill="#172B46" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" text-anchor="start">
<tspan x="64" dy="0">Encontrar uma capacidade não libera seu uso</tspan>
</text>
<text class="" x="64" y="163" fill="#52657C" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start">
<tspan x="64" dy="0">O supervisor descobre no Registry, valida o endpoint e invoca pelo Gateway.</tspan>
</text>
<rect x="1120" y="39" width="416" height="34" rx="17.0" fill="#EDF1F7"/>
<text class="" x="1328.0" y="60.55" fill="#415571" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">
<tspan x="1328.0" dy="0">FLUXO LOCAL · AWS A VALIDAR</tspan>
</text>
<rect x="64" y="850" width="1472" height="96" rx="20" fill="#172B46"/>
