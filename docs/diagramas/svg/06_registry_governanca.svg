<title id="title">Publicar, aprovar e consumir são papéis distintos</title><desc id="desc">Os registros percorrem DRAFT, PENDING_APPROVAL e APPROVED ou REJECTED. Os papéis AWS usam sessões temporárias e permissões distintas.</desc>
