<tspan x="153" dy="0">O QUE ESTE NOTEBOOK ENSINA</tspan>
</text>
<text class="" x="153" y="918" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" text-anchor="start">
<tspan x="153" dy="0">O publisher submete. O approver decide. O consumer encontra aprovados.</tspan>
</text>
<text class="" x="64" y="978" fill="#52657C" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">
<tspan x="64" dy="0">Santander  ·  Amazon Bedrock AgentCore  ·  Dados sintéticos</tspan>
</text>
<text class="" x="1536" y="978" fill="#52657C" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="end">
<tspan x="1536" dy="0">06 / 16</tspan>
</text>
