<title id="title">A fonte de dados precisa reconhecer a pessoa</title><desc id="desc">O adapter de extensão troca um JWT Entra por um token Databricks e consulta o SQL Warehouse. A identidade e a permissão da fonte são verificadas separadamente.</desc>
